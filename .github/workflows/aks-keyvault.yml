name: AKS ARC Key Vault PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyvault-test:
    name: Read Key Vault from AKS
    runs-on: arc-kv-poc

    env:
      KEYVAULT_URL: https://kv-access-policy.vault.azure.net/
      SECRET_NAME: arc-poc-secret
      EXPECTED_SECRET_VALUE: Hello-from-ARC-Workload-Identity

    steps:
      - name: Verify ARC runner and environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ARC Runner ====="
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: ${RUNNER_OS:-unknown}"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Python: $(python3 --version)"

          echo "===== Operating System ====="
          cat /etc/os-release

          echo "===== Permissions ====="
          id
          if command -v sudo >/dev/null 2>&1; then
            echo "sudo is available"
          else
            echo "sudo is not available"
          fi

      - name: Verify AKS Workload Identity injection
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Azure Workload Identity environment"

          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID is missing}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID is missing}"
          : "${AZURE_FEDERATED_TOKEN_FILE:?AZURE_FEDERATED_TOKEN_FILE is missing}"

          echo "Client ID: ${AZURE_CLIENT_ID}"
          echo "Tenant ID: ${AZURE_TENANT_ID}"

          test -f "${AZURE_FEDERATED_TOKEN_FILE}"
          test -r "${AZURE_FEDERATED_TOKEN_FILE}"

          echo "Federated token file exists and is readable."
          echo "AKS Workload Identity injection: PASSED"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          # This PoC installation path expects an Ubuntu/Debian runner.
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "ERROR: apt-get is unavailable. Use a custom runner image with pip and venv preinstalled."
            exit 1
          fi

          # Install OS packages only when the runner has sufficient privileges.
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y python3-venv python3-pip
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3-venv python3-pip
          else
            echo "ERROR: Runner has no root/sudo access to install Python packages."
            echo "Build a custom ARC runner image with python3-venv and pip installed."
            exit 1
          fi

          # Create an isolated environment for the Azure SDK.
          python3 -m venv "${RUNNER_TEMP}/azure-venv"

          "${RUNNER_TEMP}/azure-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/azure-venv/bin/python" -m pip install \
            azure-identity \
            azure-keyvault-secrets

          echo "Azure SDK installation: PASSED"

      - name: Read and validate Key Vault secret
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/read_secret.py" <<'PY'
          import os
          import sys

          from azure.identity import DefaultAzureCredential
          from azure.keyvault.secrets import SecretClient

          vault_url = os.environ["KEYVAULT_URL"]
          secret_name = os.environ["SECRET_NAME"]
          expected_value = os.environ["EXPECTED_SECRET_VALUE"]

          credential = DefaultAzureCredential()

          client = SecretClient(
              vault_url=vault_url,
              credential=credential
          )

          print("Requesting secret from Azure Key Vault...")

          secret = client.get_secret(secret_name)

          print("Azure authentication: SUCCESS")
          print(f"Key Vault URL: {vault_url}")
          print(f"Secret name: {secret.name}")
          print(f"Secret version: {secret.properties.version}")

          if secret.value != expected_value:
              print("Secret value validation: FAILED")
              sys.exit(1)

          print("Secret value validation: PASSED")
          print("KEY VAULT POC: SUCCESS")

          credential.close()
          PY

          "${RUNNER_TEMP}/azure-venv/bin/python" \
            "${RUNNER_TEMP}/read_secret.py"
